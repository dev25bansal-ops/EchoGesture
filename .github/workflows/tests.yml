name: tests

# Source-only. Model weights are not redistributable and are not in this repo,
# so weight-dependent tests skip themselves; everything else must pass.
on:
  push:
    branches: ["hackathon/**", "main"]
  pull_request:
    branches: ["hackathon/**", "main"]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt

      - name: Run the full test inventory
        run: python -I scripts/run_all_tests.py --json test-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.json
