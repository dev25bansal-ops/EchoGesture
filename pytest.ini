[pytest]
# Two defects made `pytest evaluation/device` abort before running a single test.
# Both are fixed here rather than by editing the test files, because neither is a
# defect in what those files assert.

# 1) Collection abort on a missing asset.
#    evaluation/device/v7_android/test_parity.py matches pytest's default
#    `test_*.py` pattern but is not a pytest module: it has no test functions and
#    runs its whole verification body at import time, including
#    `Interpreter(model_path=.../landmark_classifier_fp16.tflite)`. That model is
#    retired and gitignored, so the import raises ValueError and pytest aborts
#    collection for the ENTIRE suite — 519 tests, none of which run.
#    Its own docstring says to run it directly, so it is excluded here and still
#    runs when invoked by path.
#
#    `--ignore` must live in addopts. As a bare ini key it is silently ignored
#    when testpaths is set: with `ignore = ...` on its own line pytest still
#    aborted ("1 error during collection", 519 collected); the same path in
#    addopts collects 519 with no error. Measured both ways.
#
# 2) Duplicate basename collision.
#    evaluation/device/v7_latency/test_v7_latency.py and
#    evaluation/device/v8_latency/test_v7_latency.py share a module name and
#    neither directory is a package, so under the default `prepend` import mode
#    pytest collects the first and errors on the second with "import file
#    mismatch". `importlib` mode identifies modules by full path.
#    Measured: prepend collected 509 + 2 errors, importlib collects 519 + 0.
addopts = --import-mode=importlib --ignore=evaluation/device/v7_android/test_parity.py

norecursedirs = .git __pycache__ .scratch venv* _altbench
testpaths = evaluation/device
